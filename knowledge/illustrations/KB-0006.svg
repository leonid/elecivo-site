<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0006: Isolate every phase together, with one main switch</title>
  <desc id="desc">Two incoming arrangements drawn to scale on a DIN rail. In (a) three separate single-pole breakers carry L1, L2 and L3, each with its own lever, so they are not an isolator. In (b) one four-pole main switch carries L1, L2, L3 and N and one handle opens all poles together.</desc>
