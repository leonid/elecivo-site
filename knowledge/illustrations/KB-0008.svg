  <path d="M685 230V630" stroke="var(--accent)" stroke-width="4"/>
  <path d="M680 230H700M680 630H700" stroke="var(--accent)" stroke-width="3"/>
  <text x="700" y="680" class="n" style="fill:var(--accent)">demand far above 16 A</text>
  <text x="60" y="792" class="s">Check the supply that actually reaches the apartment; the stack is not to scale.</text>
  <text x="60" y="868" class="m">Fig. KB-0008 · one phase, 16 A, against the loads · Concept only, not installation guidance</text>
</svg>
