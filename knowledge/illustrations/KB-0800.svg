<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0800: On a weak supply a C16 may miss its band</title>
  <desc id="desc">Two identical circuits at the end of a long thin supply line, with a fault current of about 120 amperes. A B16 breaker trips instantly above 5 times 16, which is 80 A, so it trips at once. A C16 breaker trips instantly only above 10 times 16, which is 160 A; 120 A is inside its 80 to 160 A band, so it may not trip at once.</desc>
  <style>
    /*tokens*/:root{--surface:#f7f5f1;--panel:#ffffff;--ink:#202522;--muted:#555c58;--line:#ddd8cf;--accent:#9a4a26;--accent-soft:#f3e2d7;}@media (prefers-color-scheme:dark){:root{--surface:#181b19;--panel:#222624;--ink:#ecebe7;--muted:#b3b6b0;--line:#3a3f3c;--accent:#e8a27e;--accent-soft:#3a2a21;}}/*end-tokens*/
    text{fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .h{font-size:38px;font-weight:700} .s{font-size:24px;font-weight:500} .p{font-size:28px;font-weight:700}
    .m{font-size:22px;font-weight:600;fill:var(--muted)} .n{font-size:22px;font-weight:700}
  </style>
  <rect width="1200" height="900" fill="var(--surface)"/>
  <text x="60" y="58" class="m">Elecivo · KB-0800</text>
  <text x="1140" y="58" class="m" text-anchor="end">DRAFT • UNVERIFIED</text>
  <text x="60" y="118" class="h">On a weak supply a C16 may miss its band</text>
  <path d="M60 140H1140" stroke="var(--ink)" stroke-width="2"/>
  <text x="60" y="200" class="p">Fault current at the end of the line, amperes</text>
  <text x="60" y="366" class="h">B16</text>
  <rect x="380.79999999999995" y="330" width="147.2" height="56" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="380.79999999999995" y="318" class="s" style="paint-order:stroke;stroke:var(--surface);stroke-width:8px">instantaneous band 48–80 A</text>
  <text x="728.0" y="370" class="n" style="fill:var(--ink)">Trips at once</text>
  <text x="60" y="556" class="h">C16</text>
  <rect x="528.0" y="520" width="368.0" height="56" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="528.0" y="508" class="s" style="paint-order:stroke;stroke:var(--surface);stroke-width:8px">instantaneous band 80–160 A</text>
  <text x="728.0" y="560" class="n" style="fill:var(--accent)">May not trip at once</text>
  <path d="M712.0 270V610" stroke="var(--ink)" stroke-width="3"/><text x="712.0" y="256" text-anchor="middle" class="n">≈ 120 A</text>
  <path d="M160 640H1080" stroke="var(--ink)" stroke-width="2"/>
  <path d="M160.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="160.0" y="688" text-anchor="middle" class="m">0</text>
  <path d="M344.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="344.0" y="688" text-anchor="middle" class="m">40</text>
  <path d="M528.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="528.0" y="688" text-anchor="middle" class="m">80</text>
  <path d="M712.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="712.0" y="688" text-anchor="middle" class="m">120</text>
  <path d="M896.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="896.0" y="688" text-anchor="middle" class="m">160</text>
  <path d="M1080.0 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="1080.0" y="688" text-anchor="middle" class="m">200</text>
  <text x="60" y="792" class="s">Above the band the breaker trips at once; inside it, it may not. Check the loop impedance.</text>
  <text x="60" y="868" class="m">Fig. KB-0800 · B16 and C16 bands against a fault current of about 120 A · Concept only, not installation guidance</text>
</svg>
