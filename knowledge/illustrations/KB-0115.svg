  <path d="M600 170V760" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <text x="60" y="200" class="p">(a) Correct: from the room switch</text>
  <text x="640" y="200" class="p">(b) Wrong: from the socket</text>
  <path d="M50 640H570" stroke="var(--ink)" stroke-width="3"/>
  <path d="M115 440V360H295V440" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 440V360H295V440" fill="none" stroke="#7a4a2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="92" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="115" y="580" text-anchor="middle" class="s">Room light</text><text x="115" y="608" text-anchor="middle" class="s">switch</text><rect x="250" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="272" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="295" y="580" text-anchor="middle" class="s">Worktop light</text><text x="295" y="608" text-anchor="middle" class="s">switch</text><rect x="430" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="452" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="475" y="580" text-anchor="middle" class="s">Socket</text><text x="475" y="608" text-anchor="middle" class="s"></text>
  <path d="M650 640H1170" stroke="var(--ink)" stroke-width="3"/>
