  <rect x="670" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="692" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="715" y="580" text-anchor="middle" class="s">Room light</text><text x="715" y="608" text-anchor="middle" class="s">switch</text><rect x="850" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="872" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="895" y="580" text-anchor="middle" class="s">Worktop light</text><text x="895" y="608" text-anchor="middle" class="s">switch</text><rect x="1030" y="450" width="90" height="90" rx="8" fill="#e6e9ea" stroke="#263641" stroke-width="2.5"/><rect x="1052" y="472" width="46" height="46" rx="6" fill="#b9c1c5" stroke="#263641" stroke-width="2"/><text x="1075" y="580" text-anchor="middle" class="s">Socket</text><text x="1075" y="608" text-anchor="middle" class="s"></text>
