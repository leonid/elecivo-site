<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0009: Feed a row from a comb busbar, not a wire loop</title>
  <desc id="desc">Two rows of five single-pole breakers drawn to scale on a DIN rail. In (a) one wire loops from the top terminal of each breaker to the next, so the first terminal carries the current of the whole row. In (b) a comb busbar feeds all five from one supply wire.</desc>
