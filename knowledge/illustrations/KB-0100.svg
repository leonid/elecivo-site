<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0100: Start the board with a main isolating switch</title>
  <desc id="desc">The first rail of a board drawn to scale: the incoming supply lands on the four terminals of a wide four-pole main switch with one handle, followed by a row of narrow single-pole breakers. The switch looks different from the breakers.</desc>
