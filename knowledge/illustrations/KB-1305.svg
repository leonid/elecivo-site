<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-1305: Check large appliances against the incomer</title>
  <desc id="desc">Breaker ratings in amperes. The incoming breaker is 32 A. A single-phase air-conditioning circuit also needs 32 A, as large as the incomer, so there is no margin. A three-phase unit on 3 times 16 A is well below the incomer.</desc>
  <style>
    /*tokens*/:root{--surface:#f7f5f1;--panel:#ffffff;--ink:#202522;--muted:#555c58;--line:#ddd8cf;--accent:#9a4a26;--accent-soft:#f3e2d7;}@media (prefers-color-scheme:dark){:root{--surface:#181b19;--panel:#222624;--ink:#ecebe7;--muted:#b3b6b0;--line:#3a3f3c;--accent:#e8a27e;--accent-soft:#3a2a21;}}/*end-tokens*/
    text{fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .h{font-size:38px;font-weight:700} .s{font-size:24px;font-weight:500} .p{font-size:28px;font-weight:700}
    .m{font-size:22px;font-weight:600;fill:var(--muted)} .n{font-size:22px;font-weight:700}
  </style>
  <rect width="1200" height="900" fill="var(--surface)"/>
  <text x="60" y="58" class="m">Elecivo · KB-1305</text>
  <text x="1140" y="58" class="m" text-anchor="end">DRAFT • UNVERIFIED</text>
  <text x="60" y="118" class="h">Check large appliances against the incomer</text>
  <path d="M60 140H1140" stroke="var(--ink)" stroke-width="2"/>
  <text x="60" y="200" class="p">Breaker rating, amperes</text>
  <text x="60" y="286" class="s">Incoming breaker</text>
  <rect x="420" y="250" width="448" height="56" fill="var(--ink)"/>
  <text x="882" y="288" class="n" style="fill:var(--ink)">32 A</text>
  <text x="60" y="416" class="s">Air conditioning, single-phase</text>
  <rect x="420" y="380" width="448" height="56" fill="var(--accent)"/>
  <text x="882" y="418" class="n" style="fill:var(--accent)">32 A: no margin</text>
  <text x="60" y="546" class="s">Air conditioning, three-phase</text>
  <rect x="420" y="510" width="224" height="56" fill="var(--ink)"/>
  <text x="658" y="548" class="n" style="fill:var(--ink)">3 × 16 A</text>
  <path d="M868 230V600" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M420 640H1060" stroke="var(--ink)" stroke-width="2"/>
  <path d="M420 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="420" y="688" text-anchor="middle" class="m">0</text>
  <path d="M560 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="560" y="688" text-anchor="middle" class="m">10</text>
  <path d="M700 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="700" y="688" text-anchor="middle" class="m">20</text>
  <path d="M840 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="840" y="688" text-anchor="middle" class="m">30</text>
  <path d="M980 640V654" stroke="var(--ink)" stroke-width="1.5"/><text x="980" y="688" text-anchor="middle" class="m">40</text>
  <text x="60" y="792" class="s">A unit as big as the incomer leaves no margin: an overload may trip the whole flat.</text>
  <text x="60" y="868" class="m">Fig. KB-1305 · appliance breakers against the incoming 32 A · Concept only, not installation guidance</text>
</svg>
