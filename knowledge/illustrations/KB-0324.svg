<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0324: One conductor under each terminal</title>
  <desc id="desc">An RCD and its neutral terminal. In (a) two conductors are forced under the one clamp, so one is clamped poorly and heats. In (b) the RCD feeds an N bar and each conductor has its own terminal.</desc>
