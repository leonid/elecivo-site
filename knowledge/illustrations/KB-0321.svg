<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0321: The letter sets the instantaneous trip band</title>
  <desc id="desc">Three bars on an axis of multiples of the rated current In. Type B trips instantly at 3 to 5 times In and suits homes with mostly resistive loads, type C at 5 to 10 times In is the general choice, and type D at 10 to 20 times In is for motors and other loads with heavy start-up current.</desc>
  <style>
    /*tokens*/:root{--surface:#f7f5f1;--panel:#ffffff;--ink:#202522;--muted:#555c58;--line:#ddd8cf;--accent:#9a4a26;--accent-soft:#f3e2d7;}@media (prefers-color-scheme:dark){:root{--surface:#181b19;--panel:#222624;--ink:#ecebe7;--muted:#b3b6b0;--line:#3a3f3c;--accent:#e8a27e;--accent-soft:#3a2a21;}}/*end-tokens*/
    text{fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .h{font-size:38px;font-weight:700} .s{font-size:24px;font-weight:500} .p{font-size:28px;font-weight:700}
    .m{font-size:22px;font-weight:600;fill:var(--muted)} .n{font-size:22px;font-weight:700}
  </style>
  <rect width="1200" height="900" fill="var(--surface)"/>
  <text x="60" y="58" class="m">Elecivo · KB-0321</text>
  <text x="1140" y="58" class="m" text-anchor="end">DRAFT • UNVERIFIED</text>
  <text x="60" y="118" class="h">The letter sets the instantaneous trip band</text>
  <path d="M60 140H1140" stroke="var(--ink)" stroke-width="2"/>
  <text x="60" y="200" class="p">Instantaneous trip, multiples of rated current In</text>
  <text x="60" y="316" class="h">B</text>
  <rect x="320" y="280" width="80" height="56" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="414" y="318" class="n">3–5 × In</text>
  <text x="200" y="268" class="s">Homes, mostly resistive loads</text>
  <text x="60" y="436" class="h">C</text>
  <rect x="400" y="400" width="200" height="56" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="614" y="438" class="n">5–10 × In</text>
  <text x="200" y="388" class="s">The general choice</text>
  <text x="60" y="556" class="h">D</text>
  <rect x="600" y="520" width="400" height="56" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="610" y="558" class="n">10–20 × In</text>
  <text x="200" y="508" class="s">Motors and heavy start-up current</text>
  <path d="M200 620H1000" stroke="var(--ink)" stroke-width="2"/>
  <path d="M200 250V620" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/><path d="M200 620V634" stroke="var(--ink)" stroke-width="1.5"/><text x="200" y="668" text-anchor="middle" class="m">0</text>
  <path d="M320 250V620" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/><path d="M320 620V634" stroke="var(--ink)" stroke-width="1.5"/><text x="320" y="668" text-anchor="middle" class="m">3</text>
  <path d="M400 250V620" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/><path d="M400 620V634" stroke="var(--ink)" stroke-width="1.5"/><text x="400" y="668" text-anchor="middle" class="m">5</text>
  <path d="M600 250V620" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/><path d="M600 620V634" stroke="var(--ink)" stroke-width="1.5"/><text x="600" y="668" text-anchor="middle" class="m">10</text>
  <path d="M1000 250V620" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/><path d="M1000 620V634" stroke="var(--ink)" stroke-width="1.5"/><text x="1000" y="668" text-anchor="middle" class="m">20</text>
  <text x="60" y="792" class="s">The letter before the rating sets where the breaker trips instantly.</text>
  <text x="60" y="868" class="m">Fig. KB-0321 · instantaneous trip bands of B, C and D breakers · Concept only, not installation guidance</text>
</svg>
