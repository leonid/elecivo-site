<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KB-0003: Split a large lighting load into circuits</title>
  <desc id="desc">Two arrangements of the same ceiling and wall lights. In (a) one 10 A breaker feeds both groups and is overloaded. In (b) the same fittings are split over two 10 A circuits, ceiling lights on one and wall lights on the other.</desc>
