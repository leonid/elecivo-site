        var stored = null
        try { stored = JSON.parse(localStorage.getItem('elecivo.theme') || 'null') } catch (e) {}
        var theme = stored && typeof stored === 'object' ? stored : {}
        var scheme = ['workshop', 'panel', 'drafting'].indexOf(theme.scheme) >= 0 ? theme.scheme : 'workshop'

        document.documentElement.setAttribute('data-scheme', scheme)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
